<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = typeof originalFetch === 'function' ? originalFetch.bind(window) : originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Fallback if property is already defined
        }

        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.includes('chrome-extension://')) ||
            (event.message && event.message.includes('Cannot set property fetch'))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && String(event.reason).includes('Cannot set property fetch')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
    <title>USMBA Portail Doctorat (Prototype)</title>
